name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the pages exist and are internally linked
        run: |
          set -euo pipefail
          for f in site/index.html site/en/index.html site/styles.css site/favicon.svg; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          grep -q 'href="en/"' site/index.html
          grep -q 'href="../"' site/en/index.html
          grep -q 'href="styles.css"' site/index.html
          grep -q 'href="../styles.css"' site/en/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
